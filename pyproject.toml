[project]
name = "rfguess"
version = "0.1.0"
description = "RFGuess desktop application"
readme = "Readme.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "joblib==1.4.2",
    "mysql-connector-python==9.1.0",
    "mysqlclient>=2.2.4,<3",
    "numpy>=1.26,<3",
    "pinyin>=0.4.0,<0.5",
    "pyqt5==5.15.10",
    "pyqt5-qt5==5.15.13",
    "pyqt5-sip==12.13.0",
    "pyqt5-stubs==5.15.6.0",
    "scikit-learn==1.5.0",
    "sqlalchemy==2.0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
